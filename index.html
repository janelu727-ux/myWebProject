<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nien Chen Lu Portfolio</title>
    <style>
        /* --- 基礎設定 --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: #f0eeeb;
            color: #333;
            line-height: 1.6;
        }

        /* --- 導覽列 --- */
        .navbar {
            background-color: #4a4233be;
            padding: 20px 0;
            text-align: right;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }

        .navbar ul {
            list-style: none;
            padding-right: 5%;
        }

        .navbar ul li {
            display: inline-block;
            margin-left: 30px;
        }

        .navbar ul li a {
            color: #f0eeeb;
            text-decoration: none;
            font-size: 15px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .navbar ul li a:hover {
            color: #000;
        }

        /* --- 輪播區塊 --- */
        .carousel-container {
            color: #746254;
            position: relative;
            max-width: 1100px;
            margin: 100px auto 50px;
            padding: 0 20px;
        }

        .carousel-viewport {
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            background: #fff;
            padding: 20px 0;
        }

        .carousel-track {
            display: flex;
            width: 200%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .carousel-group {
            display: flex;
            width: 50%;
            justify-content: space-evenly;
        }

        .img-box {
            width: 22%;
            aspect-ratio: 3 / 2;
            overflow: hidden;
            border-radius: 8px;
            background: #eee;
        }

        .img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: pointer;
            transition: 0.3s;
        }

        .img-box img:hover {
            transform: scale(1.05);
        }

        /* 輪播切換按鈕 */
        .nav-btn {
            position: absolute;
            top: 60%;
            transform: translateY(-50%);
            background: #4a4233be;
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            z-index: 10;
        }

        .prev {
            left: 0;
        }

        .next {
            right: 0;
        }

        /* --- 燈箱樣式 --- */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 9999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .lightbox-content {
            max-width: 80%;
            max-height: 75%;
            border: 3px solid #fff;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        #lightbox-caption {
            color: #fff;
            margin-top: 15px;
            font-size: 18px;
            letter-spacing: 1px;
        }

        .close {
            position: absolute;
            top: 30px;
            right: 40px;
            color: #fff;
            font-size: 50px;
            cursor: pointer;
        }

        /* 燈箱內的左右按鈕 */
        .lb-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: white;
            font-size: 60px;
            cursor: pointer;
            padding: 20px;
            transition: 0.3s;
        }

        .lb-nav:hover {
            color: #ccc;
        }

        .lb-prev {
            left: 5%;
        }

        .lb-next {
            right: 5%;
        }

        /* --- 回到頂部 --- */
        #backToTop {
            display: none;
            /* 初始隱藏 */
            position: fixed;
            bottom: 40px;
            right: 40px;
            z-index: 99;
            border: none;
            outline: none;
            background-color: #746254;
            color: white;
            cursor: pointer;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(49, 49, 49, 0.5);
            transition: all 0.3s ease;
        }

        #backToTop:hover {
            background-color: #ffffff;
            color: #746254;
            transform: translateY(-5px);
        }

        /* --- 其他內容 --- */
        .content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .page-section {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .page-section img {
            width: 70%;
            height: auto;
            display: block;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <ul>
            <li><a href="#page-1">Home</a></li>
            <li><a href="#page-2">Graphic Design</a></li>
            <li><a href="#page-3">LOGO</a></li>
            <li><a href="#page-4">Posters</a></li>
            <li><a href="#page-5">Packaging Design</a></li>
            <li><a href="#page-6">Others</a></li>
            <li><a href="#page-7">Contact</a></li>
        </ul>
    </nav>

    <button onclick="topFunction()" id="backToTop">TOP</button>

    <div class="content-wrapper">
        <div id="page-1" class="page-section" style="padding-top: 80px;">
            <img src="./images/01.jpg" alt="封面首頁">
        </div>

        <div class="carousel-container">
            <h2 style="text-align: center; margin-bottom: 20px;">Collection</h2>
            <div class="carousel-viewport">
                <div class="carousel-track" id="track">
                    <div class="carousel-group">
                        <div class="img-box"><img src="./images/008.jpg" alt="SYN Dessert Studio中秋禮盒海報" class="gallery-img"></div>
                        <div class="img-box"><img src="./images/009.jpg" alt="Rolex新品上市海報" class="gallery-img"></div>
                        <div class="img-box"><img src="./images/010.jpg" alt="YouTube縮圖" class="gallery-img"></div>
                        <div class="img-box"><img src="./images/011.jpg" alt="Lumea新品活動廣告" class="gallery-img"></div>
                    </div>
                    <div class="carousel-group">
                        <div class="img-box"><img src="./images/012.jpg" alt="網頁設計" class="gallery-img"></div>
                        <div class="img-box"><img src="./images/013.jpg" alt="展覽看板" class="gallery-img"></div>
                        <div class="img-box"><img src="./images/014.jpg" alt="時尚雜誌封面" class="gallery-img"></div>
                        <div class="img-box"><img src="./images/015.jpg" alt="時裝秀票券" class="gallery-img"></div>
                    </div>
                </div>
            </div>
            <button class="nav-btn prev" onclick="moveSlide(-1)">&#10094;</button>
            <button class="nav-btn next" onclick="moveSlide(1)">&#10095;</button>
        </div>

        <div id="page-2" class="page-section"><img src="./images/02.jpg"></div>
        <div id="page-3" class="page-section"><img src="./images/03.jpg"></div>
        <div id="page-4" class="page-section"><img src="./images/04.jpg"></div>
        <div id="page-5" class="page-section"><img src="./images/05.jpg"></div>
        <div id="page-6" class="page-section"><img src="./images/06.jpg"></div>
        <div id="page-7" class="page-section"><img src="./images/07.jpg"></div>
    </div>

    <div id="lightbox" class="lightbox">
        <span class="close" onclick="closeLightbox()">&times;</span>
        <button class="lb-nav lb-prev" onclick="changeLightboxImg(-1)">&#10094;</button>

        <img class="lightbox-content" id="lightbox-img">
        <div id="lightbox-caption"></div>

        <button class="lb-nav lb-next" onclick="changeLightboxImg(1)">&#10095;</button>
    </div>

    <script>
        // ----------------- 變數設定 -----------------
        let currentIndex = 0;      // 輪播組別 (0 或 1)
        let lbIndex = 0;           // 燈箱當前圖片索引 (0-7)
        let autoPlayInterval;
        const allImgs = document.querySelectorAll('.gallery-img'); // 取得所有作品圖

        // ----------------- 輪播自動播放 -----------------
        function startAutoPlay() {
            autoPlayInterval = setInterval(() => moveSlide(1), 3500);
        }

        function moveSlide(direction) {
            const track = document.getElementById('track');
            currentIndex += direction;
            if (currentIndex > 1) currentIndex = 0;
            if (currentIndex < 0) currentIndex = 1;
            track.style.transform = `translateX(-${currentIndex * 50}%)`;
        }

        // ----------------- 燈箱邏輯 -----------------
        // 幫每一張圖綁定點擊事件
        allImgs.forEach((img, index) => {
            img.onclick = function () {
                openLightbox(index);
            };
        });

        function openLightbox(index) {
            lbIndex = index;
            clearInterval(autoPlayInterval); // 停止輪播
            document.getElementById('lightbox').style.display = 'flex';
            updateLightboxContent();
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
            document.body.style.overflow = 'auto';
            startAutoPlay();
        }

        // 燈箱切換上下張
        function changeLightboxImg(step) {
            lbIndex += step;
            if (lbIndex >= allImgs.length) lbIndex = 0;
            if (lbIndex < 0) lbIndex = allImgs.length - 1;
            updateLightboxContent();
        }

        function updateLightboxContent() {
            const imgElement = document.getElementById('lightbox-img');
            const captionElement = document.getElementById('lightbox-caption');
            const targetImg = allImgs[lbIndex];

            imgElement.src = targetImg.src;
            captionElement.innerText = targetImg.alt; // 顯示圖片說明
        }

        // ----------------- 其他功能 -----------------
        var mybutton = document.getElementById("backToTop");
        window.onscroll = function () {
            if (document.documentElement.scrollTop > 500) {
                mybutton.style.display = "block";
            } else {
                mybutton.style.display = "none";
            }
        };

        function topFunction() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 支援鍵盤左右鍵與 ESC
        document.addEventListener('keydown', (e) => {
            if (document.getElementById('lightbox').style.display === 'flex') {
                if (e.key === "ArrowLeft") changeLightboxImg(-1);
                if (e.key === "ArrowRight") changeLightboxImg(1);
                if (e.key === "Escape") closeLightbox();
            }
        });

        startAutoPlay();
    </script>
</body>

</html>
