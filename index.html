<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nien Chen Lu Portfolio</title>
    <style>
        /* --- 全域重置與基礎設定 --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            /* 讓點選選單或 TOP 時平滑捲動 */
        }

        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            font-weight: bold;
            background-color: #f0eeeb;
            /* 淺灰背景，襯托作品 */
            color: #333;
        }

        /* --- 導覽列樣式 (Navbar) --- */
        .navbar {
            background-color: #4a4233be;
            /* 深灰半透明 */
            padding: 20px 0;
            text-align: right;
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            z-index: 1000;
        }

        .navbar ul {
            list-style: none;
            padding-right: 5%;
        }

        .navbar ul li {
            display: inline-block;
            margin-left: 30px;
        }

        .navbar ul li a {
            color: #f0eeeb;
            text-decoration: none;
            font-weight: bold;
            /* 導覽列字體加粗 */
            font-size: 15px;
            letter-spacing: 1.5px;
            transition: color 0.3s ease;
            text-transform: uppercase;
            /* 選單文字大寫增加質感 */
        }

        .navbar ul li a:hover {
            color: #000000bb;
            font-weight: normal;
        }

        /* --- 內容容器與圖片設定 --- */
        .content-wrapper {
            padding-top: 0;
            /* 消除與導覽列的空隙 */
            display: flex;
            flex-direction: column;
            align-items: center;
            /* 水平置中所有區塊 */
        }

        .page-section {
            width: 100%;
            display: flex;
            justify-content: center;
            background-color: transparent;
            margin: 0;
            /* 移除圖片之間的上下間隙，若要間距可調整此值 */
        }

        .page-section img {
            width: 70%;
            /* 圖片寬度 75% */
            height: auto;
            display: block;
            /* 輕微陰影增加立體感 */
        }

        /* --- TOP 回到頂部按鈕 --- */
        #backToTop {
            display: none;
            /* 初始隱藏 */
            position: fixed;
            bottom: 40px;
            right: 40px;
            z-index: 99;
            border: none;
            outline: none;
            background-color: #746254;
            color: white;
            cursor: pointer;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(49, 49, 49, 0.5);
            transition: all 0.3s ease;
        }

        #backToTop:hover {
            background-color: #ffffff;
            color: #746254;
            transform: translateY(-5px);
            /* 懸停時往上飄 */
        }

        /* --- 手機版適應 (Responsive) --- */
        @media (max-width: 768px) {
            .page-section img {
                width: 90%;
                /* 手機上圖片調大，閱讀更舒適 */
            }

            .navbar {
                text-align: center;
                padding: 15px 0;
            }

            .navbar ul {
                padding-right: 0;
            }

            .navbar ul li {
                margin: 0 10px;
            }

            .navbar ul li a {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <ul>
            <li><a href="#page-1">Home</a></li>
            <li><a href="#page-2">Graphic Design</a></li>
            <li><a href="#page-3">LOGO</a></li>
            <li><a href="#page-4">Posters</a></li>
            <li><a href="#page-5">Packaging Design</a></li>
            <li><a href="#page-6">Others</a></li>
            <li><a href="#page-7">Contact</a></li>
        </ul>
    </nav>

    <button onclick="topFunction()" id="backToTop" title="Go to top">TOP</button>

    <div class="content-wrapper">
        <div id="page-1" class="page-section">
            <img src="./images/11.jpg" alt="Cover Page">
        </div>
        <div id="page-2" class="page-section">
            <img src="./images/22.jpg" alt="Graphic Design Showcase">
        </div>
        <div id="page-3" class="page-section">
            <img src="./images/33.jpg" alt="Logo Standards">
        </div>
        <div id="page-4" class="page-section">
            <img src="./images/44.jpg" alt="Exhibition Poster Design">
        </div>
        <div id="page-5" class="page-section">
            <img src="./images/55.jpg" alt="Luméa Packaging Design">
        </div>
        <div id="page-6" class="page-section">
            <img src="./images/66.jpg" alt="Lemonade Cafe Menu and Signage">
        </div>
        <div id="page-7" class="page-section">
            <img src="./images/77.jpg" alt="Contact Information">
        </div>
    </div>

    <script>
        // 取得按鈕
        var mybutton = document.getElementById("backToTop");

        // 當捲動超過 500px 時顯示按鈕
        window.onscroll = function () {
            if (document.body.scrollTop > 500 || document.documentElement.scrollTop > 500) {
                mybutton.style.display = "block";
            } else {
                mybutton.style.display = "none";
            }
        };

        // 點擊 TOP 回到頂部
        function topFunction() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }
    </script>

</body>

</html>
